[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "job-scraper"
version = "0.1.0"
description = "Scrape job postings from multiple job boards and export as markdown"
requires-python = ">=3.11"
dependencies = [
    "scrapling[fetchers]",
    "pytest",
    "beautifulsoup4",
    "playwright>=1.63.0",
    "patchright>=1.63.0",
]

[dependency-groups]
dev = [
    "pytest-socket>=0.8.1",
]

[tool.pytest.ini_options]
addopts = "--disable-socket"
